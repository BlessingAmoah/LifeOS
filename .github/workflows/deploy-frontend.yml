name: Deploy Frontend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: lifeos-frontend
  NODE_VERSION: '24.x'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: https://lifeos-backend.azurewebsites.net/api

      - name: Prepare deployment package
        run: |
          npm prune --omit=dev --prefix frontend
          mkdir -p "$RUNNER_TEMP/lifeos-frontend"
          cp -R frontend/dist/. "$RUNNER_TEMP/lifeos-frontend/"
          cp frontend/server.js "$RUNNER_TEMP/lifeos-frontend/"
          cp -R frontend/node_modules "$RUNNER_TEMP/lifeos-frontend/"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/lifeos-frontend
